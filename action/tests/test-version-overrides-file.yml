name: Test version input overrides version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - id: action
        uses: .
        with:
          version: 2.4.0
          version-file: /nonexistent/flux-version
      - name: Assert version input was used
        run: |
          OUT="$(flux -v)"
          echo "actual: $OUT"
          if [ "$OUT" != "flux version 2.4.0" ]; then
            echo "FAIL: expected 'flux version 2.4.0'"
            exit 1
          fi
          echo "PASS"
