name: Test default (latest) version without token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - id: action
        uses: .
      - name: Assert a flux version was installed
        run: |
          OUT="$(flux -v)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE 'flux version [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected flux -v output"
            exit 1
          fi
          echo "PASS"
