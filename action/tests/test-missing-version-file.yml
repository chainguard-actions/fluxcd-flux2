name: Test missing version-file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: .
        continue-on-error: true
        with:
          version-file: /tmp/does-not-exist-flux-version.txt
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing version-file"
            exit 1
          fi
          echo "PASS"
