name: Test latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          token: ${{ github.token }}
      - name: Assert some flux version installed
        run: |
          OUT="$(flux -v)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE '^flux version [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected flux -v output"
            exit 1
          fi
          echo "PASS"
