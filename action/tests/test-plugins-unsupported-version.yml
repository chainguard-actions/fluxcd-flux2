name: Test plugins with unsupported flux version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Populate workspace with the action if it is missing
        run: |
          set -euo pipefail
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE" || true
          if [ -f "$GITHUB_WORKSPACE/action/action.yml" ]; then
            echo "action/action.yml already present; using it as-is"
            exit 0
          fi
          mkdir -p "$GITHUB_WORKSPACE"
          if curl -fsSL https://codeload.github.com/fluxcd/flux2/tar.gz/refs/tags/v2.10.1 \
              | tar xz --strip-components=1 -C "$GITHUB_WORKSPACE" flux2-2.10.1/action; then
            echo "fetched action via tarball"
          else
            tmp="$(mktemp -d)"
            git clone --depth 1 --branch v2.10.1 https://github.com/fluxcd/flux2 "$tmp/flux2"
            cp -r "$tmp/flux2/action" "$GITHUB_WORKSPACE/action"
          fi
          ls -la "$GITHUB_WORKSPACE/action"
          test -f "$GITHUB_WORKSPACE/action/action.yml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 2.0.0
          plugins: mirror
      - name: Assert action failed at plugin gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PLUGIN_DIR: ${{ steps.action.outputs.plugin-dir }}
        run: |
          echo "outcome: $OUTCOME"
          echo "plugin-dir: '$PLUGIN_DIR'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for plugins on flux 2.0.0"
            exit 1
          fi
          if [ -n "$PLUGIN_DIR" ]; then
            echo "FAIL: plugin-dir should not be set"
            exit 1
          fi
          OUT="$(flux -v 2>&1 || true)"
          echo "flux -v: $OUT"
          echo "$OUT" | grep -q "2.0.0" || { echo "FAIL: flux 2.0.0 should still be installed (failure must come from the plugin gate)"; exit 1; }
          echo "PASS"
