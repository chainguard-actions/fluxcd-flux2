name: Test plugins with unsupported flux version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 2.4.0
          bindir: /tmp/flux-plugin-gate
          plugins: mirror
      - name: Assert action failed at plugin gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PLUGIN_DIR: ${{ steps.action.outputs.plugin-dir }}
        run: |
          echo "outcome: $OUTCOME"
          echo "plugin-dir: '$PLUGIN_DIR'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since flux 2.4.0 lacks plugin support"
            exit 1
          fi
          if [ -n "$PLUGIN_DIR" ]; then
            echo "FAIL: plugin-dir should not be set"
            exit 1
          fi
          BIN=/tmp/flux-plugin-gate/flux
          if [ ! -x "$BIN" ]; then
            echo "FAIL: flux binary should still be installed at $BIN"
            exit 1
          fi
          OUT="$("$BIN" -v)"
          echo "flux: $OUT"
          if [ "$OUT" != "flux version 2.4.0" ]; then
            echo "FAIL: expected 'flux version 2.4.0'"
            exit 1
          fi
          echo "PASS"
