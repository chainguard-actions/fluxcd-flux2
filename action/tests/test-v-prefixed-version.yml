name: Test v-prefixed version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - id: action
        uses: .
        with:
          version: v2.3.0
      - name: Assert v prefix was stripped and version installed
        run: |
          OUT="$(flux -v)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "2.3.0"; then
            echo "FAIL: expected version 2.3.0"
            exit 1
          fi
          P="$(command -v flux)"
          echo "flux path: $P"
          case "$P" in
            */flux2/2.3.0/*) echo "PASS" ;;
            *) echo "FAIL: expected tool dir to use version without v prefix"; exit 1 ;;
          esac
