name: Test invalid version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 0.0.0-doesnotexist
          bindir: ${{ github.workspace }}/.flux-invalid
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent version"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/.flux-invalid/flux" ]; then
            echo "FAIL: binary should not be installed"
            exit 1
          fi
          echo "PASS"
