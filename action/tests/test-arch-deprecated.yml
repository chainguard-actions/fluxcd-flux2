name: Test deprecated arch input is accepted and ignored
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - id: action
        uses: .
        with:
          version: 2.4.0
          arch: amd64
      - name: Assert flux installed with expected version
        run: |
          command -v flux || { echo "FAIL: flux not on PATH"; exit 1; }
          OUT="$(flux -v)"
          echo "actual: $OUT"
          if [ "$OUT" != "flux version 2.4.0" ]; then
            echo "FAIL: expected 'flux version 2.4.0'"
            exit 1
          fi
          echo "PASS"
